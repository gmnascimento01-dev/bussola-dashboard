<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bússola — dashboard</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root {
    --bg:#0F1310; --surface:#171D18; --feed-bg:#141914; --border:#232B25; --border-soft:#202820;
    --hover:#1c231d; --text:#EDF2ED; --text-dim:#8A968B; --text-dim2:#6B786C; --text-dim3:#7C8A7D;
    --chip-bg:#1F2620; --chip-border:#2A332B; --track-bg:#20271F; --tab-bg:#12160F; --tab-ativa-bg:#232B25;
    --input-bg:#12160F; --accent-green:#4CC38A; --accent-red:#E2574C; --accent-amber:#E3A548;
    --alerta-bg:#211C13; --alerta-border:#4A3B1E; --alerta-texto:#C9BFA3; --alerta-item:#D8CDAE;
    --erro-bg:#2A1615; --erro-border:#6B2A26; --erro-texto:#F2B8B4;
  }
  [data-theme="light"] {
    --bg:#F4F7F1; --surface:#FFFFFF; --feed-bg:#FFFFFF; --border:#E2E8DC; --border-soft:#E9EEE3;
    --hover:#F0F4EA; --text:#1A2118; --text-dim:#5B6B5C; --text-dim2:#7A8A7B; --text-dim3:#63715F;
    --chip-bg:#EFF3EA; --chip-border:#DCE4D6; --track-bg:#E4EADF; --tab-bg:#EAEFE5; --tab-ativa-bg:#FFFFFF;
    --input-bg:#F4F7F1; --accent-green:#2E9E68; --accent-red:#C64B3F; --accent-amber:#B87C22;
    --alerta-bg:#FBF1DE; --alerta-border:#E6CE9C; --alerta-texto:#6B5A32; --alerta-item:#5C4C29;
    --erro-bg:#FBEAE7; --erro-border:#E7B4AC; --erro-texto:#8A2E24;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:20px 16px 60px; transition:background .15s ease, color .15s ease; }
  ::placeholder { color:#6b7a6d; }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--accent-green); outline-offset:2px; }
  .wordmark { font-family:'Fraunces', serif; font-weight:600; font-size:30px; letter-spacing:-0.01em; }
  .tagline { color:var(--text-dim3); font-size:13px; }
  .header-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; justify-content:space-between; }
  .header-right { display:flex; gap:8px; align-items:center; }
  .grid { display:grid; grid-template-columns:1.3fr 1fr; gap:16px; max-width:1080px; margin:16px auto 0; }
  @media (max-width:720px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .card-alerta { background:var(--alerta-bg); border:1px solid var(--alerta-border); border-radius:14px; padding:16px; }
  .feed { background:var(--feed-bg); border:1px solid var(--border-soft); border-radius:14px; padding:6px; display:flex; flex-direction:column; gap:2px; max-height:600px; overflow-y:auto; }
  .linha { display:flex; justify-content:space-between; align-items:center; padding:10px; border-radius:10px; gap:8px; flex-wrap:wrap; }
  .linha:hover { background:var(--hover); }
  .linha-esq { display:flex; gap:10px; align-items:center; min-width:0; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .desc { font-size:13.5px; font-weight:500; }
  .meta-linha { font-size:11px; color:var(--text-dim2); margin-top:1px; }
  .chip { background:var(--chip-bg); border:1px solid var(--chip-border); border-radius:20px; padding:4px 8px; font-size:11.5px; }
  .valor { font-family:'IBM Plex Mono', monospace; font-size:13.5px; font-weight:600; min-width:88px; text-align:right; }
  .tabs { display:flex; gap:4px; background:var(--tab-bg); padding:4px; border-radius:10px; margin-bottom:12px; }
  .tab { flex:1; background:transparent; border:none; color:var(--text-dim); padding:6px 8px; border-radius:7px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .tab.ativa { background:var(--tab-ativa-bg); color:var(--text); font-weight:600; }
  .saldo-label { font-size:12px; color:var(--text-dim); }
  .saldo-valor { font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; margin:2px 0 10px; }
  .duas-colunas { display:flex; gap:24px; }
  .mini-label { font-size:11px; color:var(--text-dim); }
  .mini-valor { font-family:'IBM Plex Mono', monospace; font-size:14.5px; font-weight:600; }
  .categorias-titulo { font-size:12.5px; color:var(--text-dim); margin-bottom:10px; font-weight:600; }
  .barra-linha { margin-bottom:10px; }
  .barra-topo { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .barra-valor { font-family:'IBM Plex Mono', monospace; color:var(--text-dim2); }
  .barra-track { height:7px; border-radius:6px; overflow:hidden; background:var(--track-bg); position:relative; }
  .barra-fill { height:100%; border-radius:6px; }
  .barra-limite { position:absolute; top:0; bottom:0; width:2px; background:var(--text); opacity:0.65; }
  .vazio { color:var(--text-dim2); font-size:13px; padding:24px 14px; text-align:center; }
  .btn { background:var(--accent-green); color:#0F1310; border:none; border-radius:10px; padding:10px 16px; font-weight:600; cursor:pointer; font-size:13px; }
  .btn-ghost { background:transparent; color:var(--text-dim); border:1px solid var(--border); border-radius:8px; padding:8px 12px; cursor:pointer; font-size:12.5px; }
  .btn-icon { background:transparent; color:var(--text-dim); border:1px solid var(--border); border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .setup-box { max-width:420px; margin:80px auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px; }
  .setup-box label { font-size:12.5px; color:var(--text-dim); display:block; margin:14px 0 6px; }
  .setup-box input { width:100%; background:var(--input-bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-size:13px; font-family:'IBM Plex Mono', monospace; }
  .erro { background:var(--erro-bg); border:1px solid var(--erro-border); color:var(--erro-texto); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px; }
  .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:1080px; margin:16px auto 0; }
  @media (max-width:900px) { .charts-row { grid-template-columns:1fr; } }
  .charts-row.full { grid-template-columns:1fr; }
  .chart-titulo { font-size:12.5px; color:var(--text-dim); margin-bottom:12px; font-weight:600; }
  .chart-box { position:relative; height:220px; }
  .nav-abas { max-width:1080px; margin:16px auto 0; }
  .full-largura { max-width:1080px; margin:16px auto 0; }
</style>
<script>
  // Aplica o tema salvo antes de pintar a página, pra evitar flash de tema errado
  (function() {
    const salvo = localStorage.getItem('bussola-tema') || 'dark';
    document.documentElement.setAttribute('data-theme', salvo);
  })();
</script>
</head>
<body>

<div id="app"></div>

<script>
const API_CONFIG_KEY = 'bussola-config';

function getConfig() {
  const params = new URLSearchParams(window.location.search);
  const urlWorker = params.get('workerUrl');
  const urlToken = params.get('token');
  if (urlWorker && urlToken) {
    const cfg = { workerUrl: urlWorker, token: urlToken };
    setConfig(cfg);
    return cfg;
  }
  try { return JSON.parse(localStorage.getItem(API_CONFIG_KEY)); } catch { return null; }
}
function setConfig(cfg) {
  localStorage.setItem(API_CONFIG_KEY, JSON.stringify(cfg));
}
function fmtMoeda(v) {
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

const ABAS = [
  ['resumo', 'Resumo'],
  ['dividas', 'Dívidas'],
  ['orcamento', 'Orçamento'],
  ['saude', 'Saúde Financeira'],
  ['investimentos', 'Investimentos'],
  ['mercado', 'Mercado'],
];

let estado = {
  abaAtiva: 'resumo',
  periodo: 'mes',
  resumo: null,
  transacoes: [],
  serieMensal: null,
  dividas: [],
  orcamentos: [],
  investimentos: [],
  investimentosTotal: 0,
  mercadoCotacoes: null,
  mercadoManchetes: null,
  mercadoCarregando: false,
  mercadoErro: null,
  carregando: true,
  erro: null,
};

let charts = {};

async function carregarDados() {
  const cfg = getConfig();
  if (!cfg) { renderSetup(); return; }
  estado.carregando = true;
  estado.erro = null;
  render();
  try {
    const base = cfg.workerUrl.replace(/\/$/, '');
    const [resResumo, resTx, resSerie, resDividas, resOrcamento, resInvestimentos] = await Promise.all([
      fetch(base + '/api/resumo?periodo=' + estado.periodo + '&token=' + encodeURIComponent(cfg.token)),
      fetch(base + '/api/transacoes?token=' + encodeURIComponent(cfg.token)),
      fetch(base + '/api/serie-mensal?meses=6&token=' + encodeURIComponent(cfg.token)),
      fetch(base + '/api/dividas?token=' + encodeURIComponent(cfg.token)),
      fetch(base + '/api/orcamento?token=' + encodeURIComponent(cfg.token)),
      fetch(base + '/api/investimentos?token=' + encodeURIComponent(cfg.token)),
    ]);
    if (!resResumo.ok || !resTx.ok || !resSerie.ok || !resDividas.ok || !resOrcamento.ok || !resInvestimentos.ok) {
      throw new Error('Falha ao buscar dados (verifique a URL e o token)');
    }
    estado.resumo = await resResumo.json();
    const dadosTx = await resTx.json();
    estado.transacoes = dadosTx.transacoes || [];
    estado.serieMensal = await resSerie.json();
    const dadosDividas = await resDividas.json();
    estado.dividas = dadosDividas.dividas || [];
    const dadosOrcamento = await resOrcamento.json();
    estado.orcamentos = dadosOrcamento.orcamentos || [];
    const dadosInvestimentos = await resInvestimentos.json();
    estado.investimentos = dadosInvestimentos.investimentos || [];
    estado.investimentosTotal = dadosInvestimentos.total || 0;
  } catch (err) {
    estado.erro = err.message || 'Não consegui carregar os dados.';
  } finally {
    estado.carregando = false;
    render();
  }
}

/** Mercado é buscado à parte (só quando a aba abre), porque envolve chamadas externas
 * (brapi.dev + RSS) mais lentas e que não fazem sentido rodar toda vez que o período muda. */
async function carregarMercado() {
  const cfg = getConfig();
  if (!cfg) return;
  estado.mercadoCarregando = true;
  estado.mercadoErro = null;
  render();
  try {
    const base = cfg.workerUrl.replace(/\/$/, '');
    const [resCotacoes, resManchetes] = await Promise.all([
      fetch(base + '/api/mercado/cotacoes?token=' + encodeURIComponent(cfg.token)),
      fetch(base + '/api/mercado/manchetes?token=' + encodeURIComponent(cfg.token)),
    ]);
    if (!resCotacoes.ok || !resManchetes.ok) throw new Error('Falha ao buscar dados de mercado.');
    estado.mercadoCotacoes = await resCotacoes.json();
    const dadosManchetes = await resManchetes.json();
    estado.mercadoManchetes = dadosManchetes.manchetes || [];
  } catch (err) {
    estado.mercadoErro = err.message || 'Não consegui carregar os dados de mercado.';
  } finally {
    estado.mercadoCarregando = false;
    render();
  }
}

function trocarAba(aba) {
  estado.abaAtiva = aba;
  render();
  if (aba === 'mercado' && !estado.mercadoCotacoes && !estado.mercadoManchetes && !estado.mercadoCarregando) {
    carregarMercado();
  }
}

function renderSetup(msgErro) {
  document.getElementById('app').innerHTML = `
    <div class="setup-box">
      <div class="wordmark">Bússola</div>
      <div class="tagline">conectar ao seu bot</div>
      ${msgErro ? `<div class="erro" style="margin-top:16px;">${msgErro}</div>` : ''}
      <label>URL do Worker (Cloudflare)</label>
      <input id="in-url" placeholder="https://bussola-bot.seunome.workers.dev" />
      <label>Token do dashboard</label>
      <input id="in-token" placeholder="o mesmo valor do DASHBOARD_TOKEN" />
      <button class="btn" style="margin-top:18px; width:100%;" onclick="salvarConfig()">Conectar</button>
    </div>
  `;
}

function salvarConfig() {
  const url = document.getElementById('in-url').value.trim();
  const token = document.getElementById('in-token').value.trim();
  if (!url || !token) return;
  setConfig({ workerUrl: url, token });
  carregarDados();
}

function trocarPeriodo(p) {
  estado.periodo = p;
  carregarDados();
}

function desconectar() {
  localStorage.removeItem(API_CONFIG_KEY);
  render();
}

function getTema() {
  return document.documentElement.getAttribute('data-theme') || 'dark';
}
function alternarTema() {
  const novo = getTema() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', novo);
  localStorage.setItem('bussola-tema', novo);
  render(); // já redesenha os gráficos da aba atual sozinho, no final da própria função
}
function corVar(nome) {
  return getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
}

/** Gasto médio dos meses com movimento na série de 6 meses — mesma ideia usada no plano de
 * quitação de dívidas do bot, só que aqui só pra informar "quantos meses o patrimônio cobre". */
function calcularGastoMedioMensal() {
  if (!estado.serieMensal) return null;
  const comMovimento = (estado.serieMensal.serie || []).filter(m => m.entradas > 0 || m.saidas > 0);
  if (comMovimento.length === 0) return null;
  return comMovimento.reduce((s, m) => s + m.saidas, 0) / comMovimento.length;
}

function renderAbaDividas() {
  const dividas = estado.dividas || [];
  if (dividas.length === 0) {
    return `
      <div class="card">
        <div class="chart-titulo">Dívidas</div>
        <div class="vazio">Nenhuma dívida cadastrada</div>
      </div>
    `;
  }

  const ativas = dividas.filter(d => d.status === 'ativa');
  const totalDevidoAgora = ativas.reduce((s, d) => s + d.valor_atual, 0);
  const totalOriginal = dividas.reduce((s, d) => s + d.valor_original, 0);
  const totalAtualGeral = dividas.reduce((s, d) => s + d.valor_atual, 0);
  const totalQuitado = totalOriginal - totalAtualGeral;
  const pctQuitado = totalOriginal > 0 ? Math.min(100, (totalQuitado / totalOriginal) * 100) : 0;

  const listaHtml = ativas.length === 0
    ? '<div class="vazio">Nenhuma dívida ativa — tudo quitado! 🎉</div>'
    : ativas.map(d => `
        <div class="linha">
          <div class="linha-esq">
            <div class="desc">${d.descricao}</div>
            ${d.taxa_juros_mensal || d.parcela_mensal ? `<div class="meta-linha">${d.taxa_juros_mensal ? 'juros ' + d.taxa_juros_mensal + '%/mês' : ''}${d.taxa_juros_mensal && d.parcela_mensal ? ' · ' : ''}${d.parcela_mensal ? 'parcela ' + fmtMoeda(d.parcela_mensal) : ''}</div>` : ''}
          </div>
          <span class="valor" style="color:var(--accent-red);">${fmtMoeda(d.valor_atual)}</span>
        </div>
      `).join('');

  return `
    <div class="card">
      <div class="chart-titulo">Dívidas</div>
      <div class="saldo-label">Total devido agora</div>
      <div class="saldo-valor" style="color:var(--accent-red);">${fmtMoeda(totalDevidoAgora)}</div>
      <div class="barra-topo"><span>Quitado</span><span class="barra-valor">${pctQuitado.toFixed(0)}% de ${fmtMoeda(totalOriginal)}</span></div>
      <div class="barra-track"><div class="barra-fill" style="width:${pctQuitado}%; background:var(--accent-green);"></div></div>
      <div class="feed" style="margin-top:14px; max-height:400px;">${listaHtml}</div>
    </div>
  `;
}

/**
 * Índice de saúde financeira — fórmula fixa e determinística, sem IA. Média simples de três
 * sinais, cada um normalizado pra 0-100 e orientado de forma que "mais alto = mais saudável":
 *  a) % dos meses da série de 6 meses (estado.serieMensal) com saldo positivo.
 *  b) 100 - (% do gasto do período em categorias redutíveis). Calcula o percentual redutível
 *     com a MESMA lógica do alerta "Gastos possivelmente redutíveis" (soma das categorias com
 *     c.reducivel === true, dividido pelo total de saídas do período) e INVERTE o sinal — menos
 *     gasto redutível é mais saudável, então o percentual bruto entraria de trás pra frente
 *     numa média simples se não fosse invertido.
 *  c) % do total histórico já quitado em dívidas: soma (valor_original - valor_atual) de TODAS
 *     as dívidas (ativas + quitadas) dividido pela soma de valor_original. Sem nenhuma dívida
 *     cadastrada, conta como 100 — não ter dívida nenhuma é saudável, não neutro.
 * Faixas do rótulo qualitativo (as únicas três, sem inventar nenhuma a mais):
 *   0-40 "Atenção" · 41-70 "Estável" · 71-100 "Saudável"
 */
function calcularSaudeFinanceira() {
  if (!estado.serieMensal || !estado.resumo) return null;

  const serie = estado.serieMensal.serie || [];
  const a = serie.length ? (serie.filter(m => m.saldo > 0).length / serie.length) * 100 : 0;

  const totalGasto = estado.resumo.saidas || 0;
  const totalReduzivel = (estado.resumo.categorias || []).filter(c => c.reducivel).reduce((s, c) => s + c.valor, 0);
  const percentualRedutivel = totalGasto > 0 ? (totalReduzivel / totalGasto) * 100 : 0;
  const b = 100 - percentualRedutivel;

  const dividas = estado.dividas || [];
  let c;
  if (dividas.length === 0) {
    c = 100;
  } else {
    const totalOriginal = dividas.reduce((s, d) => s + d.valor_original, 0);
    const totalAtual = dividas.reduce((s, d) => s + d.valor_atual, 0);
    c = totalOriginal > 0 ? Math.min(100, ((totalOriginal - totalAtual) / totalOriginal) * 100) : 100;
  }

  const score = (a + b + c) / 3;
  // o corte de faixa usa o score ARREDONDADO — é o número que aparece na tela, e o rótulo
  // precisa concordar com ele (senão dá pra mostrar "40" e "Estável" ao mesmo tempo, quando o
  // corte diz que 40 já é "Atenção")
  const scoreArredondado = Math.round(score);
  const label = scoreArredondado <= 40 ? 'Atenção' : scoreArredondado <= 70 ? 'Estável' : 'Saudável';
  const cor = scoreArredondado <= 40 ? 'var(--accent-red)' : scoreArredondado <= 70 ? 'var(--accent-amber)' : 'var(--accent-green)';
  return { score, label, cor, a, b, c };
}

function renderAbaSaude() {
  const saude = calcularSaudeFinanceira();
  if (!saude) {
    return `<div class="card"><div class="chart-titulo">Índice de saúde financeira</div><div class="vazio">Carregando…</div></div>`;
  }
  return `
    <div class="card">
      <div class="chart-titulo">Índice de saúde financeira</div>
      <div class="saldo-valor" style="color:${saude.cor}; font-size:44px;">${saude.score.toFixed(0)}<span style="font-size:16px; color:var(--text-dim); font-weight:500;"> / 100</span></div>
      <div class="mini-label" style="margin-bottom:18px;">${saude.label}</div>
      <div class="duas-colunas">
        <div><div class="mini-label">Meses no azul</div><div class="mini-valor">${saude.a.toFixed(0)}%</div></div>
        <div><div class="mini-label">Gasto essencial</div><div class="mini-valor">${saude.b.toFixed(0)}%</div></div>
        <div><div class="mini-label">Dívidas quitadas</div><div class="mini-valor">${saude.c.toFixed(0)}%</div></div>
      </div>
    </div>
  `;
}

function renderAbaInvestimentos() {
  const investimentos = estado.investimentos || [];
  if (investimentos.length === 0) {
    return `<div class="card"><div class="chart-titulo">Investimentos</div><div class="vazio">Nenhum investimento registrado</div></div>`;
  }

  const total = estado.investimentosTotal || investimentos.reduce((s, i) => s + i.valor, 0);
  const porTipo = {};
  investimentos.forEach(i => { porTipo[i.tipo] = (porTipo[i.tipo] || 0) + i.valor; });
  const tipos = Object.entries(porTipo).sort((a, b) => b[1] - a[1]);
  const maiorTipo = Math.max(...tipos.map(([, v]) => v));

  const gastoMedio = calcularGastoMedioMensal();
  const meses = gastoMedio && gastoMedio > 0 ? total / gastoMedio : null;

  const listaHtml = investimentos.map(i => `
    <div class="linha">
      <div class="linha-esq"><div><div class="desc">${i.descricao}</div><div class="meta-linha">${i.tipo}</div></div></div>
      <span class="valor" style="color:var(--accent-green);">${fmtMoeda(i.valor)}</span>
    </div>
  `).join('');

  return `
    <div class="charts-row">
      <div class="card">
        <div class="chart-titulo">Investimentos</div>
        <div class="saldo-label">Total registrado</div>
        <div class="saldo-valor" style="color:var(--accent-green);">${fmtMoeda(total)}</div>
        ${meses !== null ? `<div class="mini-label">Isso cobre ~${meses.toFixed(1)} meses do seu gasto médio</div>` : ''}
        <div style="border-top:1px solid var(--border-soft); padding-top:12px; margin-top:14px;">
          <div class="categorias-titulo">Por tipo</div>
          ${tipos.map(([tipo, valor]) => `
            <div class="barra-linha">
              <div class="barra-topo"><span>${tipo}</span><span class="barra-valor">${fmtMoeda(valor)}</span></div>
              <div class="barra-track"><div class="barra-fill" style="width:${(valor/maiorTipo*100)}%; background:var(--accent-green);"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card">
        <div class="chart-titulo">Todos os registros</div>
        <div class="feed" style="max-height:400px;">${listaHtml}</div>
      </div>
    </div>
    <div style="font-size:12px; color:var(--text-dim2); margin-top:14px; padding:0 4px; max-width:1080px;">
      Isso é só um registro do que você declarou ter — não é avaliação nem recomendação de investimento.
    </div>
  `;
}

function renderAbaMercado() {
  if (estado.mercadoCarregando) {
    return `<div class="card"><div class="vazio">Carregando cotações e notícias…</div></div>`;
  }
  if (estado.mercadoErro) {
    return `<div class="erro">${estado.mercadoErro}</div>`;
  }

  const cot = estado.mercadoCotacoes;
  const manchetes = estado.mercadoManchetes || [];
  const fmtPct = (v) => (v === null || v === undefined || isNaN(v)) ? '' : ` (${v >= 0 ? '+' : ''}${v.toFixed(2)}%)`;

  const blocoCotacao = (label, dado, formatador) => {
    if (!dado || dado.valor === null || dado.valor === undefined) {
      return `<div><div class="mini-label">${label}</div><div class="mini-valor">—</div></div>`;
    }
    // só colore de verde/vermelho quando existe variação de verdade — sem isso (dólar e Selic,
    // que vêm do Banco Central sem variação diária na mesma chamada), fica na cor neutra do
    // texto, pra não parecer "em alta" sem ter nenhum dado de tendência
    const temVariacao = dado.variacao !== null && dado.variacao !== undefined && !isNaN(dado.variacao);
    const cor = temVariacao ? (dado.variacao >= 0 ? 'var(--accent-green)' : 'var(--accent-red)') : 'var(--text)';
    return `<div><div class="mini-label">${label}</div><div class="mini-valor" style="color:${cor};">${formatador(dado.valor)}${fmtPct(dado.variacao)}</div></div>`;
  };

  const manchetesHtml = manchetes.length === 0
    ? '<div class="vazio">Nenhuma manchete disponível agora.</div>'
    : manchetes.map(m => `
        <a href="${m.link}" target="_blank" rel="noopener noreferrer" class="linha" style="text-decoration:none; color:inherit;">
          <div class="desc">${m.titulo}</div>
          <span style="color:var(--text-dim2); font-size:16px;">↗</span>
        </a>
      `).join('');

  return `
    <div class="card">
      <div class="chart-titulo">Cotações</div>
      <div class="duas-colunas">
        ${blocoCotacao('Ibovespa', cot && cot.ibovespa, (v) => v.toLocaleString('pt-BR', { maximumFractionDigits: 0 }))}
        ${blocoCotacao('Dólar (USD/BRL)', cot && cot.dolar, (v) => 'R$ ' + v.toFixed(2).replace('.', ','))}
        ${blocoCotacao('Selic', cot && cot.selic, (v) => v.toFixed(2).replace('.', ',') + '%')}
      </div>
      <div style="font-size:11px; color:var(--text-dim2); margin-top:14px;">Cotações atualizadas a cada carregamento da página — não é tempo real.</div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="chart-titulo">Manchetes</div>
      <div class="feed">${manchetesHtml}</div>
      <div style="font-size:11px; color:var(--text-dim2); margin-top:10px;">Fonte: Money Times. Só título e link — o conteúdo completo está no site original.</div>
    </div>
  `;
}

function renderAbaResumo() {
  const periodos = [['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês'], ['ano', 'Ano']];

  const feedHtml = estado.transacoes.length === 0
    ? '<div class="vazio">Nenhum lançamento ainda.</div>'
    : estado.transacoes.map(t => {
        const cor = t.tipo === 'entrada' ? 'var(--accent-green)' : 'var(--accent-red)';
        const data = new Date(t.data_hora);
        return `
          <div class="linha">
            <div class="linha-esq">
              <span class="dot" style="background:${cor};"></span>
              <div>
                <div class="desc">${t.descricao || t.texto}</div>
                <div class="meta-linha">${data.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} · ${data.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
              </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <span class="chip">${t.categoria}</span>
              <span class="valor" style="color:${cor};">${t.tipo === 'entrada' ? '+' : '−'} ${fmtMoeda(t.valor)}</span>
            </div>
          </div>
        `;
      }).join('');

  return `
    <div class="grid">
      <div>
        <div class="feed">
          ${estado.carregando ? '<div class="vazio">Carregando…</div>' : feedHtml}
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="card">
          <div class="tabs">
            ${periodos.map(([p,label]) => `<button class="tab ${estado.periodo===p?'ativa':''}" onclick="trocarPeriodo('${p}')">${label}</button>`).join('')}
          </div>
          ${estado.resumo ? `
            <div class="saldo-label">Saldo do período</div>
            <div class="saldo-valor" style="color:${estado.resumo.saldo>=0?'var(--accent-green)':'var(--accent-red)'};">${fmtMoeda(estado.resumo.saldo)}</div>
            <div class="duas-colunas">
              <div><div class="mini-label">Entradas</div><div class="mini-valor" style="color:var(--accent-green);">${fmtMoeda(estado.resumo.entradas)}</div></div>
              <div><div class="mini-label">Saídas</div><div class="mini-valor" style="color:var(--accent-red);">${fmtMoeda(estado.resumo.saidas)}</div></div>
            </div>
          ` : '<div class="vazio">Carregando…</div>'}
        </div>
      </div>
    </div>

    ${estado.serieMensal ? `
    <div class="charts-row">
      <div class="card">
        <div class="chart-titulo">Evolução do saldo (últimos 6 meses)</div>
        <div class="chart-box"><canvas id="chart-saldo"></canvas></div>
      </div>
      <div class="card">
        <div class="chart-titulo">Entradas x saídas por mês</div>
        <div class="chart-box"><canvas id="chart-entradas-saidas"></canvas></div>
      </div>
    </div>
    ` : ''}
  `;
}

function renderAbaOrcamento() {
  let categoriasHtml = '';
  let alertaHtml = '';
  if (estado.resumo && estado.resumo.categorias && estado.resumo.categorias.length) {
    const maior = Math.max(...estado.resumo.categorias.map(c => c.valor));
    const orcamentoPorCategoria = {};
    (estado.orcamentos || []).forEach(o => { if (o.categoria) orcamentoPorCategoria[o.categoria] = o; });

    categoriasHtml = estado.resumo.categorias.map(c => {
      const orc = orcamentoPorCategoria[c.nome];
      // a marca de limite é posicionada na MESMA escala da barra (relativa ao maior gasto do
      // período) — se o limite for maior que o maior gasto atual, ela fica cravada em 100%
      const marcaLimite = orc ? Math.min(100, (orc.limiteMensal / maior) * 100) : null;
      return `
      <div class="barra-linha">
        <div class="barra-topo"><span>${c.nome}</span><span class="barra-valor">${fmtMoeda(c.valor)}${orc ? ' / ' + fmtMoeda(orc.limiteMensal) : ''}</span></div>
        <div class="barra-track">
          <div class="barra-fill" style="width:${(c.valor/maior*100)}%; background:${c.reducivel ? 'var(--accent-amber)' : 'var(--accent-green)'};"></div>
          ${marcaLimite !== null ? `<div class="barra-limite" style="left:${marcaLimite}%;" title="Orçamento: ${fmtMoeda(orc.limiteMensal)}"></div>` : ''}
        </div>
      </div>
    `;
    }).join('');

    const reduziveis = estado.resumo.categorias.filter(c => c.reducivel);
    const totalReduzivel = reduziveis.reduce((s,c) => s + c.valor, 0);
    if (totalReduzivel > 0) {
      alertaHtml = `
        <div class="card-alerta">
          <div style="font-weight:600; font-size:13.5px; margin-bottom:8px;">💡 Gastos possivelmente redutíveis</div>
          <div style="font-size:13px; color:var(--alerta-texto); line-height:1.5;">Neste período, <b>${fmtMoeda(totalReduzivel)}</b> foram para categorias que costumam dar espaço pra economia:</div>
          <ul style="margin:10px 0; padding-left:18px; font-size:12.5px; color:var(--alerta-item); line-height:1.9;">
            ${reduziveis.map(c => `<li>${c.nome} — ${fmtMoeda(c.valor)}</li>`).join('')}
          </ul>
        </div>
      `;
    }
  }

  return `
    <div class="grid">
      <div class="card">
        <div class="chart-titulo">Por categoria</div>
        ${categoriasHtml || '<div class="vazio">Sem lançamentos neste período.</div>'}
      </div>
      <div>${alertaHtml}</div>
    </div>
    ${estado.serieMensal ? `
    <div class="charts-row full">
      <div class="card">
        <div class="chart-titulo">Categorias ao longo do tempo (top 5)</div>
        <div class="chart-box"><canvas id="chart-categorias"></canvas></div>
      </div>
    </div>
    ` : ''}
  `;
}

function renderAbaAtiva() {
  switch (estado.abaAtiva) {
    case 'dividas': return `<div class="full-largura">${renderAbaDividas()}</div>`;
    case 'orcamento': return renderAbaOrcamento();
    case 'saude': return `<div class="full-largura">${renderAbaSaude()}</div>`;
    case 'investimentos': return `<div class="full-largura">${renderAbaInvestimentos()}</div>`;
    case 'mercado': return `<div class="full-largura">${renderAbaMercado()}</div>`;
    default: return renderAbaResumo();
  }
}

function destruirGraficos() {
  Object.keys(charts).forEach((k) => { if (charts[k]) charts[k].destroy(); delete charts[k]; });
}

function redesenharGraficosDaAbaAtiva() {
  if (!estado.serieMensal) return;
  if (estado.abaAtiva === 'resumo') desenharGraficosResumo(estado.serieMensal);
  if (estado.abaAtiva === 'orcamento') desenharGraficoCategorias(estado.serieMensal);
}

function render() {
  const cfg = getConfig();
  if (!cfg) { renderSetup(); return; }

  destruirGraficos();

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header-row">
      <div>
        <span class="wordmark">Bússola</span>
        <span class="tagline" style="margin-left:10px;">seu dinheiro, sua direção</span>
      </div>
      <div class="header-right">
        <button class="btn-icon" onclick="alternarTema()" title="Alternar tema">${getTema() === 'dark' ? '☀️' : '🌙'}</button>
        <button class="btn-ghost" onclick="desconectar()">Trocar conexão</button>
      </div>
    </div>

    ${estado.erro ? `<div class="erro" style="max-width:1080px; margin:14px auto 0;">${estado.erro}</div>` : ''}

    <div class="nav-abas">
      <div class="tabs">
        ${ABAS.map(([id,label]) => `<button class="tab ${estado.abaAtiva===id?'ativa':''}" onclick="trocarAba('${id}')">${label}</button>`).join('')}
      </div>
    </div>

    ${renderAbaAtiva()}
  `;

  redesenharGraficosDaAbaAtiva();
}

function labelMes(chave) {
  const [ano, mes] = chave.split('-').map(Number);
  const d = new Date(ano, mes - 1, 1);
  return d.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }).replace('.', '');
}

function getOpcoesChartBase() {
  const textDim = corVar('--text-dim');
  const borderSoft = corVar('--border-soft');
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: textDim, font: { family: 'Inter', size: 11 } } } },
    scales: {
      x: { ticks: { color: textDim, font: { family: 'Inter', size: 11 } }, grid: { color: borderSoft } },
      y: { ticks: { color: textDim, font: { family: 'IBM Plex Mono', size: 10 } }, grid: { color: borderSoft } },
    },
  };
}

function chartJsIndisponivel(ids) {
  if (typeof Chart !== 'undefined') return false;
  ids.forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.parentElement.innerHTML = '<div class="vazio">Não consegui carregar a biblioteca de gráficos (Chart.js). Tenta recarregar a página.</div>';
  });
  return true;
}

function desenharGraficosResumo(dados) {
  if (chartJsIndisponivel(['chart-saldo', 'chart-entradas-saidas'])) return;

  const labels = dados.serie.map((m) => labelMes(m.mes));
  const opcoesBase = getOpcoesChartBase();
  const corVerde = corVar('--accent-green');
  const corVermelho = corVar('--accent-red');

  const ctxSaldo = document.getElementById('chart-saldo');
  if (ctxSaldo) {
    charts.saldo = new Chart(ctxSaldo, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Saldo',
          data: dados.serie.map((m) => m.saldo),
          borderColor: corVerde,
          backgroundColor: corVerde + '26',
          fill: true,
          tension: 0.3,
          pointBackgroundColor: corVerde,
        }],
      },
      options: { ...opcoesBase, plugins: { legend: { display: false } } },
    });
  }

  const ctxEntSai = document.getElementById('chart-entradas-saidas');
  if (ctxEntSai) {
    charts.entradasSaidas = new Chart(ctxEntSai, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Entradas', data: dados.serie.map((m) => m.entradas), backgroundColor: corVerde },
          { label: 'Saídas', data: dados.serie.map((m) => m.saidas), backgroundColor: corVermelho },
        ],
      },
      options: opcoesBase,
    });
  }
}

function desenharGraficoCategorias(dados) {
  if (chartJsIndisponivel(['chart-categorias'])) return;

  const labels = dados.serie.map((m) => labelMes(m.mes));
  const opcoesBase = getOpcoesChartBase();
  const corVerde = corVar('--accent-green');
  const corVermelho = corVar('--accent-red');
  const corAmbar = corVar('--accent-amber');

  const ctxCat = document.getElementById('chart-categorias');
  if (ctxCat && dados.topCategorias && dados.topCategorias.length) {
    const cores = [corVerde, corAmbar, '#5B8DEF', corVermelho, '#B679D6'];
    charts.categorias = new Chart(ctxCat, {
      type: 'line',
      data: {
        labels,
        datasets: dados.topCategorias.map((cat, i) => ({
          label: cat,
          data: dados.serie.map((m) => m.categorias[cat] || 0),
          borderColor: cores[i % cores.length],
          backgroundColor: cores[i % cores.length],
          tension: 0.3,
          pointRadius: 3,
        })),
      },
      options: opcoesBase,
    });
  }
}

carregarDados();
</script>
</body>
</html>
